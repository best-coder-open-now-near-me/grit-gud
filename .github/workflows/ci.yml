name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run engine-free simulation contracts
        run: |
          dotnet restore tools/simulation/GritGud.SimulationChecks.csproj --configfile tools/simulation/NuGet.Config
          dotnet run --project tools/simulation/GritGud.SimulationChecks.csproj -c Release --no-restore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository boundaries
        run: python tools/validate-repository.py

      - name: Validate Supabase migrations and RPC contracts
        run: python tools/validate-supabase-contracts.py

      - name: Test preview identity contract
        run: node tools/preview-id.test.mjs

      - name: Test WebGL browser artifact contract
        run: node tools/webgl-build-smoke.test.mjs

  unity:
    name: Licensed Unity tests
    needs: source
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      checks: write
      contents: read
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read licensed asset revision
        id: licensed_asset_config
        shell: bash
        run: |
          ref="$(tr -d '\r\n' < .github/private-assets-ref)"
          if [ -z "$ref" ]; then
            echo "The tracked private asset ref is empty." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out licensed test assets
        uses: actions/checkout@v4
        with:
          repository: best-coder-open-now-near-me/private-assets
          ref: ${{ steps.licensed_asset_config.outputs.ref }}
          token: ${{ secrets.PRIVATE_ASSETS }}
          path: .private-assets
          lfs: true
          persist-credentials: false

      - name: Install licensed test assets
        id: licensed_assets
        shell: bash
        run: |
          if [ ! -f .private-assets/grit-gud/.grit-gud-private-assets ]; then
            echo "The private repository does not contain the Grit Gud asset source." >&2
            exit 1
          fi
          if [ ! -d .private-assets/grit-gud/Assets ]; then
            echo "The Grit Gud private asset source must contain an Assets directory." >&2
            exit 1
          fi
          revision="$(git -C .private-assets rev-parse HEAD)"
          rsync -a --exclude='.git*' .private-assets/grit-gud/Assets/ Assets/
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          rm -rf .private-assets

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune --all --force

      - name: Restore Unity import cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-Tests-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}-${{ steps.licensed_assets.outputs.revision }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-Tests-
            Unity-Library-${{ runner.os }}-WebGL-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          unityVersion: auto
          testMode: editmode
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: CI EditMode test results

      - name: Upload EditMode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-editmode-test-results-${{ github.run_id }}
          path: artifacts/editmode
          if-no-files-found: ignore

      - name: Run PlayMode lifecycle tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          unityVersion: auto
          testMode: playmode
          artifactsPath: artifacts/playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: CI PlayMode lifecycle test results

      - name: Upload PlayMode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-playmode-test-results-${{ github.run_id }}
          path: artifacts/playmode
          if-no-files-found: ignore
